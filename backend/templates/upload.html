<!DOCTYPE html>
<html>
<head>
    <title>Upload Prescription</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="app-body">

    <aside class="sidebar">
        <div class="sidebar-logo">
            <span class="logo-text">Health<span class="accent">Connect</span></span>
        </div>
        <nav class="sidebar-nav">
            <a href="/dashboard" class="nav-item"><i class="bi bi-house"></i> Home</a>
            <a href="/medicines" class="nav-item"><i class="bi bi-capsule"></i> Medicines</a>
            <a href="/records" class="nav-item"><i class="bi bi-file-earmark-text"></i> Records</a>
            <a href="/profile" class="nav-item"><i class="bi bi-person"></i> Profile</a>
        </nav>
        <a href="/logout" class="logout-link"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </aside>

    <main class="main-content">

        <h2 class="page-title">Upload Prescription</h2>
        <p class="page-subtitle">Upload a photo and let AI read it for you</p>

        <div class="upload-box">
            <i class="bi bi-file-earmark-plus upload-icon"></i>
            <h3>Upload Prescription Image</h3>
            <p>JPG, PNG or PDF (Max. 10MB)</p>
            <label for="prescriptionFile" class="btn-upload">Choose File</label>
            <input type="file" id="prescriptionFile" accept=".jpg,.jpeg,.png,.pdf" hidden>
            <p id="fileName" class="file-name"></p>
        </div>

        <div class="tips-box">
            <h4>Tips for better results</h4>
            <p><i class="bi bi-check2"></i> Take a clear photo</p>
            <p><i class="bi bi-check2"></i> Good lighting</p>
            <p><i class="bi bi-check2"></i> All details visible</p>
        </div>

        <div class="ai-result-box">
            <h4>AI extracted details</h4>
            <textarea id="aiOutput" class="ai-textarea" placeholder="Extracted medicine names, dosage, frequency, and instructions will appear here after you upload a prescription."></textarea>
        </div>

    </main>

</body>
</html>
