<!DOCTYPE html>
<html>
<head>
    
<link rel="stylesheet" href="{{url_for('static',filename = 'css/style.css')}}">
<title>Apricity AI-login</title>
</head>
<body>
    <div class="login-container">
    <div class="logo-area">
        <img src="{{url_for('static',filename = 'images/health1.png')}}" class="logo-img">
<h1>Apricity <span>AI</span><span></span></h1>
    </div>
    <form class ="login-form" id="loginform">
        <div class ="input-group">
            <label for ="identifier">Email or Phone Number</label>
            <input type ="text" id="identifier" placeholder="Email or Phone Number">
        </div>
        <div class ="input-group">
            <label for ="password">Password</label>
            <input type ="password" id="password"placeholder="Password">
        </div>
        <div class ="form-actions">
        <label class ="remember-me">
            <input type="checkbox" id="remember"> Remember Me 
        </label>
        
    </div>
    <button type="submit" class="btn-login">Sign In</button>
    <p class ="signup-redirect">
        Don't have an account? <a href = "{{url_for('signup')}}">Sign Up</a>
    </p>
    </form>
    <script src ="{{url_for('static',filename = 'js/auth.js')}}"></script>
</body>
</html>
