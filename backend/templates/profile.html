<!DOCTYPE html>
<html>
<head>
    <title>Profile</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
</head>
<body class="app-body">

    <aside class="sidebar">
        <div class="sidebar-logo">
            <span class="logo-text">Apricity <span class="accent">AI</span></span>
        </div>
        <nav class="sidebar-nav">
            <a href="/dashboard" class="nav-item"><i class="bi bi-house"></i> Home</a>
            <a href="/medicines" class="nav-item"><i class="bi bi-capsule"></i> Medicines</a>
            <a href="/records" class="nav-item"><i class="bi bi-file-earmark-text"></i> Records</a>
            <a href="/profile" class="nav-item active"><i class="bi bi-person"></i> Profile</a>
            <a href="javascript:void(0)" class="nav-item" onclick="toggleChat()"><i class="bi bi-chat-dots"></i> Ask AI</a>

        </nav>
        <a href="/logout" class="logout-link"><i class="bi bi-box-arrow-right"></i> Logout</a>
    </aside>

    <main class="main-content">

        <h2 class="page-title">My Profile</h2>
        <p class="page-subtitle">Manage your personal details</p>

        <div class="profile-card">
            <div class="profile-avatar">{{ name[0] | upper }}</div>
            <div>
                <p class="profile-name">{{ name }}</p>
                <p class="profile-contact">{{ email }}</p>
                <p class="profile-contact">{{ phone }}</p>
            </div>
        </div>

        <div class="details-box">
            <h4>Personal Details</h4>
            <div class="detail-row">
                <span>Name</span>
                <span>{{ name }}</span>
            </div>
            <div class="detail-row">
                <span>Email</span>
                <span>{{ email }}</span>
            </div>
            <div class="detail-row">
                <span>Phone</span>
                <span>{{ phone }}</span>
            </div>
        </div>

    </main>

</body>
</html>
